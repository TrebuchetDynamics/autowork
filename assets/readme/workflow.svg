<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">Plan, queue, execute, report</title>
  <desc id="desc">Plan accepted work, queue it in TODO.md, execute an eligible task with /autowork, and report checks and delivery separately. The next authorized run uses the remaining queue.</desc>
  <rect width="1200" height="180" rx="16" fill="#101a18"/>
  <g font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="22" fill="#aab8ae">
    <text x="64" y="48">01</text><text x="322" y="48">02</text>
    <text x="610" y="48">03</text><text x="950" y="48">04</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="600" fill="#f4f3e8">
    <text x="64" y="116">Plan</text><text x="322" y="116">Queue</text>
    <text x="610" y="116" fill="#b7e88c">Execute</text><text x="950" y="116">Report</text>
  </g>
  <g fill="none" stroke="#aab8ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M218 98 h52 m-11 -9 11 9 -11 9"/>
    <path d="M516 98 h42 m-11 -9 11 9 -11 9"/>
    <path d="M850 98 h48 m-11 -9 11 9 -11 9"/>
  </g>
</svg>
