<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Autowork — your repository, one work queue</title>
  <desc id="desc">Repository workflows built around the tasks/ store. Plan accepted tasks, execute with /autowork, and verify each change. This is a conceptual workflow, not an execution receipt.</desc>
  <rect width="1200" height="460" rx="16" fill="#101a18"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="66" font-size="22" letter-spacing="3" fill="#aab8ae">REPOSITORY WORKFLOWS</text>
    <text x="58" y="188" font-size="98" font-weight="700" letter-spacing="-4" fill="#f4f3e8">Autowork</text>
    <text x="64" y="264" font-size="46" letter-spacing="-1" fill="#f4f3e8">Your repository. One work queue.</text>
  </g>
  <g id="task-mark" fill="none" stroke="#b7e88c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1040" y="111" width="88" height="88" rx="8"/>
    <path d="M1061 153 l16 17 31 -37"/>
  </g>
  <path d="M64 316 H1136" stroke="#364b43" stroke-width="2"/>
  <g id="work-queue" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="40" fill="#b7e88c">
    <text x="64" y="394">tasks/</text>
    <text x="400" y="394">/autowork</text>
    <text x="876" y="394">checks</text>
  </g>
  <g fill="none" stroke="#aab8ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M280 380 h64 m-12 -10 12 10 -12 10"/>
    <path d="M688 380 h120 m-12 -10 12 10 -12 10"/>
  </g>
</svg>
