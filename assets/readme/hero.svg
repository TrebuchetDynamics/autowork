<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Toolset</title>
  <desc id="desc">Hermes Toolset turns repository goals into verified changes, tracked in TODO.md. A TODO.md card shows one completed task, the next ready task that /autowork picks up, and a queued task.</desc>

  <rect width="1200" height="400" rx="24" fill="#11151a"/>

  <g id="title-block" transform="translate(64 0)">
    <text x="0" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2" fill="#8a939d">HERMES · CODEX · PI  —  REPOSITORY WORKFLOWS</text>
    <text x="0" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="66" font-weight="700" fill="#ecebe6">Hermes Toolset</text>
    <text x="0" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" fill="#ecebe6">Turn repository goals into</text>
    <text x="0" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" fill="#ecebe6">verified changes, tracked in <tspan fill="#e5b454" font-weight="600">TODO.md</tspan>.</text>

    <g id="commands" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">
      <rect x="0" y="304" width="192" height="44" rx="10" fill="none" stroke="#3a424c" stroke-width="2"/>
      <text x="18" y="333" fill="#ecebe6">/plan_with_me</text>
      <rect x="208" y="304" width="180" height="44" rx="10" fill="none" stroke="#3a424c" stroke-width="2"/>
      <text x="226" y="333" fill="#ecebe6">/plan_for_me</text>
      <rect x="404" y="304" width="144" height="44" rx="10" fill="#e5b454"/>
      <text x="422" y="333" fill="#11151a" font-weight="700">/autowork</text>
    </g>
  </g>

  <g id="todo-card" transform="translate(676 40)">
    <rect width="460" height="320" rx="16" fill="#171c22" stroke="#2a3139" stroke-width="2"/>
    <text x="24" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8a939d">TODO.md</text>
    <line x1="0" y1="58" x2="460" y2="58" stroke="#2a3139" stroke-width="2"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">
      <text x="24" y="96" fill="#8a939d" font-weight="700">## Now</text>

      <g id="done">
        <rect x="24" y="116" width="22" height="22" rx="5" fill="#5bbf7a"/>
        <path d="M29 127 l5 5 l9 -10" fill="none" stroke="#11151a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="60" y="134" fill="#8a939d">CACHE-01</text>
        <text x="172" y="134" fill="#8a939d">Bounded storage</text>
      </g>

      <g id="next">
        <rect x="12" y="156" width="436" height="64" rx="10" fill="#e5b454" fill-opacity="0.10" stroke="#e5b454" stroke-width="2"/>
        <rect x="24" y="168" width="22" height="22" rx="5" fill="none" stroke="#e5b454" stroke-width="2.5"/>
        <text x="60" y="186" fill="#ecebe6" font-weight="700">CACHE-02</text>
        <text x="172" y="186" fill="#ecebe6">Verify eviction</text>
        <text x="60" y="210" font-size="18" fill="#e5b454">Checks: pytest tests/test_cache.py</text>
      </g>

      <text x="24" y="258" fill="#8a939d" font-weight="700">## Next</text>
      <rect x="24" y="276" width="22" height="22" rx="5" fill="none" stroke="#3a424c" stroke-width="2.5"/>
      <text x="60" y="294" fill="#8a939d">CACHE-03</text>
      <text x="172" y="294" fill="#8a939d">Cache metrics</text>
    </g>
  </g>
</svg>
