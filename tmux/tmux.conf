# SSH-friendly tmux profile: compact colors, explicit copying, no plugins.
# Keep resize behavior at tmux defaults: do not set window-size or aggressive-resize.

# Use a portable 256-color terminal description; do not force client RGB support.
set -g default-terminal "tmux-256color"
set -g focus-events off
# Explicit tmux copies can use OSC 52 over SSH when the client supports it.
# Applications cannot replace tmux buffers through their own OSC 52 sequences.
set -s set-clipboard external
set -g extended-keys on
# Termius identifies as xterm-256color; sync batches frames to prevent flicker, but
# mishandled end-of-frame markers can drop whole frames (stale text after resize).
# Disabled for testing: re-enable if flicker returns.
# set -su terminal-features
# set -as terminal-features ',xterm-256color:sync'

# Scrollback and input
set -g history-limit 20000
# Mouse selects and scrolls, but only y/Enter copies. Prefix+m toggles mouse.
set -g mouse on
setw -g mode-keys vi
set -g status-keys emacs
# Slightly relaxed timings tolerate mobile SSH jitter and slower touch key sequences.
set -sg escape-time 100
set -g repeat-time 750
set -g display-time 3000
set -g display-panes-time 2000

# Numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Window/session behavior. Suppress title and bell updates that trigger extra
# terminal repaints over slow SSH links.
setw -g automatic-rename off
setw -g allow-rename off
set -g set-titles off
set -g bell-action none
# Detach when this session ends instead of jumping to another session.
set -g detach-on-destroy on

# Keep the status bar visible at the bottom. Prefix+t toggles it when needed.
set -g status on
set -g status-position bottom
set -g status-interval 0
set -g @primary_color '#06d6a0'
set -g @primary_text_color '#101820'
source-file -q ~/.tmux/style.tmux
set -g status-style 'bg=#161e2e,fg=#cbd5e1'
set -g status-justify left
set -g status-left "#[bg=#{@primary_color},fg=#{@primary_text_color},bold] #S #[bg=#161e2e,fg=#94a3b8,nobold] #(~/.tmux/short-path.sh #{q:pane_current_path}) #(~/.tmux/git-status.sh #{q:pane_current_path})"
# Leave space for window tabs on small SSH terminals.
set -g status-left-length 40
# Slow links (SSH/mobile): TMUX_SLOW=1 tmux drops the per-redraw shell helpers.
if-shell 'test "${TMUX_SLOW:-0}" = 1' 'set -g status-left "#[bg=#{@primary_color},fg=#{@primary_text_color},bold] #S "'
set -g status-right '#[fg=#ffd166,bold]#{?window_zoomed_flag, ZOOM ,}#[bg=#{@primary_color},fg=#{@primary_text_color},bold] #H '
set -g status-right-length 22
set -g window-status-separator ' '
set -g window-status-style 'bg=#161e2e,fg=#94a3b8'
set -g window-status-current-style 'bg=#{@primary_color},fg=#{@primary_text_color},bold'
set -g window-status-activity-style 'fg=#ffd166,bold'
set -g window-status-format ' #I:#W#{?window_flags,#{window_flags},} '
set -g window-status-current-format ' #I:#W#{?window_zoomed_flag, Z,} '

# Borders
set -g pane-border-style 'fg=#334155'
set -g pane-active-border-style 'fg=#{@primary_color}'
set -g message-style 'bg=#161e2e,fg=#ffd166'
set -g message-command-style 'bg=#161e2e,fg=#{@primary_color}'
setw -g mode-style 'bg=#5f87ff,fg=#101820'
set -g display-panes-colour '#94a3b8'
set -g display-panes-active-colour '#06d6a0'
set -g clock-mode-style 24

# Basic keybindings
bind R source-file ~/.tmux.conf \; display-message "Reloaded"
bind r refresh-client -S \; display-message "Redrawn"
bind t set-option status
bind m set-option -g mouse \; display-message 'Mouse: #{?mouse,on,off}'
bind v copy-mode
bind X confirm-before -p "kill-window #W? (y/n)" kill-window

# Releasing a drag keeps the selection and copy mode; it never copies.
# Override both tables so this remains safe if mode-keys changes locally.
bind -T copy-mode MouseDragEnd1Pane send -X stop-selection
bind -T copy-mode-vi MouseDragEnd1Pane send -X stop-selection
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel

# New windows and splits keep current directory
bind c new-window -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Pane navigation
bind -r H select-pane -L
bind -r J select-pane -D
bind -r K select-pane -U
bind -r L select-pane -R
bind -r i display-panes

# Pane resize
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 3
bind -r C-k resize-pane -U 3
bind -r C-l resize-pane -R 5

# Session/window navigation
bind -r ( switch-client -p
bind -r ) switch-client -n
bind s choose-tree -s

# Local machine overrides, e.g. richer local terminals can re-enable dynamic status.
source-file -q ~/.tmux/local.tmux
