name: test
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # The engine commits and merges as the host's Git user (it drops GIT_* variables), as on
      # any machine that runs it; the runner image has none.
      - name: Git identity
        run: git config --global user.name CI && git config --global user.email ci@example.invalid
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Plugin and bundled workflow offline suites
        run: python scripts/check.py
      - name: Plugin syntax
        run: python -m py_compile __init__.py
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Pi command adapter offline tests
        run: node --test tests/portable_pi.test.mjs
