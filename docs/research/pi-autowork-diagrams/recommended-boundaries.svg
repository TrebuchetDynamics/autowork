ght="650">Pi Autowork runtime boundary</text><text x="600.0" y="455" text-anchor="middle" fill="#e2e8f0" font-size="21">Launch / observe / stop / resume</text><text x="600.0" y="482" text-anchor="middle" fill="#e2e8f0" font-size="21">Thin CLI; source belongs to Toolset</text><rect x="50" y="580" width="300" height="115" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="200.0" y="615" text-anchor="middle" fill="#34d399" font-size="22" font-weight="650">Pi worker A</text><text x="200.0" y="645" text-anchor="middle" fill="#e2e8f0" font-size="21">Owned worktree + commit</text><text x="200.0" y="672" text-anchor="middle" fill="#e2e8f0" font-size="21">Structured run result</text><rect x="450" y="580" width="300" height="115" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="600.0" y="615" text-anchor="middle" fill="#34d399" font-size="22" font-weight="650">Pi worker B</text><text x="600.0" y="645" text-anchor="middle" fill="#e2e8f0" font-size="21">Owned worktree + commit</text><text x="600.0" y="672" text-anchor="middle" fill="#e2e8f0" font-size="21">Structured run result</text><rect x="850" y="580" width="300" height="115" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="1000.0" y="615" text-anchor="middle" fill="#34d399" font-size="22" font-weight="650">Pi worker N</text><text x="1000.0" y="645" text-anchor="middle" fill="#e2e8f0" font-size="21">Owned worktree + commit</text><text x="1000.0" y="672" text-anchor="middle" fill="#e2e8f0" font-size="21">Structured run result</text><rect x="350" y="780" width="500" height="110" rx="12" fill="#0f172a" stroke="#fb7185" stroke-width="2"/><text x="600.0" y="815" text-anchor="middle" fill="#fb7185" font-size="25" font-weight="650">Source-bound acceptance gate</text><text x="600.0" y="845" text-anchor="middle" fill="#e2e8f0" font-size="21">Validate exact combined candidate</text><text x="600.0" y="872" text-anchor="middle" fill="#e2e8f0" font-size="21">Fresh target + one canonical writer</text><rect x="350" y="940" width="500" height="125" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="600.0" y="975" text-anchor="middle" fill="#22d3ee" font-size="25" font-weight="650">Verified main / master delivery</text><text x="600.0" y="1005" text-anchor="middle" fill="#e2e8f0" font-size="21">Recoverable metadata closure</text><text x="600.0" y="1032" text-anchor="middle" fill="#e2e8f0" font-size="21">Then eligible cleanup + report</text><text x="32" y="1105" fill="#94a3b8" font-size="18">PROPOSED • Reuse mechanisms, not another backlog • No implicit push or service migration</text></g></svg>