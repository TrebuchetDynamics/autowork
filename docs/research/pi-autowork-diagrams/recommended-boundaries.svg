<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1130" viewBox="0 0 1200 1130" role="img" aria-labelledby="title desc"><title id="title">Recommended boundary model — one lifecycle authority</title><desc id="desc">Proposed adaptation of studied source mechanisms. TODO and goals remain authoritative; the shared engine owns state, Pi executes, and canonical verification precedes closure and cleanup. This diagram is a proposal, not implemented behavior.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#94a3b8"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern></defs><rect width="1200" height="1130" fill="#020617"/><rect width="1200" height="1130" fill="url(#grid)"/><g font-family="system-ui, sans-serif"><path d="M600 165V220" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M300 280H350" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M900 280H850" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M600 345V390" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M600 500V540H200V580" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M600 500V580" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M600 540H1000V580" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M200 695V740H600V780" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M600 695V780" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1000 695V740H600" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M600 890V940" stroke="#94a3b8" stroke-