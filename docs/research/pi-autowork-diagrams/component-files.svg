<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">Pi Autowork file ownership — three locations, one product</title><desc id="desc">Proposed component organization separates Toolset source, consumer-project intent and private runtime data. Shared generic engine code stays shared. Credentials, worktrees and logs do not move into source.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#94a3b8"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern></defs><rect width="1200" height="810" fill="#020617"/><rect width="1200" height="810" fill="url(#grid)"/><g font-family="system-ui, sans-serif"><rect x="25" y="95" width="350" height="585" rx="14" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 5"/><text x="200" y="65" fill="#fbbf24" font-size="22" font-weight="650" text-anchor="middle">AUTOWORK SOURCE</text><rect x="425" y="95" width="350" height="585" rx="14" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="8 5"/><text x="600" y="65" fill="#22d3ee" font-size="22" font-weight="650" text-anchor="middle">CONSUMER PROJECT</text><rect x="825" y="95" width="350" height="585" rx="14" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="8 5"/><text x="1000" y="65" fill="#a78bfa" font-size="22" font-weight="650" text-anchor="middle">PRIVATE RUNTIME</text><rect x="45" y="130" width="310" height="130" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/><text x="200.0" y="165" text-anchor="middle" fill="#fbbf24" font-size="22" font-weight="650">pi-autowork/</text><text x="200.0" y="195" text-anchor="middle" fill="#e2e8f0" font-size="21">Pi-specific Python modules</text><text x="200.0" y="222" text-anchor="middle" fill="#e2e8f0" font-size="21">Tests + component runbook</text><rect x="45" y="310" width="310" height="130" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="200.0" y="345" text-anchor="middle" fill="#34d399" font-size="22" font-weight="650">Shared engine</text><text x="200.0" y="375" text-anchor="middle" fill="#e2e8f0" font-size="21">skills/autowork/scripts/</text><text x="200.0" y="402" text-anchor="middle" fill="#e2e8f0" font-size="21">Queue / leases / integration</text><rect x="45" y="490" width="310" height="130" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/><text x="200.0" y="525" text-anchor="middle" fill="#fbbf24" font-size="22" font-weight="650">One distribution</text><text x="200.0" y="555" text-anchor="middle" fill="#e2e8f0" font-size="21">Legacy launcher shim</text><text x="200.0" y="582" text-anchor="middle" fill="#e2e8f0" font-size="21">Component ships in npm</text><rect x="445" y="130" width="310" height="130" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="600.0" y="165" text-anchor="middle" fill="#22d3ee" font-size="22" font-weight="650">TODO.md + goals.json</text><text x="600.0" y="195" text-anchor="middle" fill="#e2e8f0" font-size="21">Accepted scope + priority</text><text x="600.0" y="222" text-anchor="middle" fill="#e2e8f0" font-size="21">Dependencies + progress</text><rect x="445" y="310" width="310" height="130" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="600.0" y="345" text-anchor="middle" fill="#22d3ee" font-size="22" font-weight="650">Project instructions</text><text x="600.0" y="375" text-anchor="middle" fill="#e2e8f0" font-size="21">Acceptance / checks</text><text x="600.0" y="402" text-anchor="middle" fill="#e2e8f0" font-size="21">Setup + resources</text><rect x="445" y="490" width="310" height="130" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="600.0" y="525" text-anchor="middle" fill="#22d3ee" font-size="22" font-weight="650">Canonical branch</text><text x="600.0" y="555" text-anchor="middle" fill="#e2e8f0" font-size="21">main or master</text><text x="600.0" y="582" text-anchor="middle" fill="#e2e8f0" font-size="21">Verified integrated result</text><rect x="845" y="130" width="310" height="130" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text x="1000.0" y="165" text-anchor="middle" fill="#a78bfa" font-size="22" font-weight="650">Runner state</text><text x="1000.0" y="195" text-anchor="middle" fill="#e2e8f0" font-size="21">Sessions / budgets / logs</text><text x="1000.0" y="222" text-anchor="middle" fill="#e2e8f0" font-size="21">Existing XDG state root</text><rect x="845" y="310" width="310" height="130" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text x="1000.0" y="345" text-anchor="middle" fill="#a78bfa" font-size="22" font-weight="650">Engine state</text><text x="1000.0" y="375" text-anchor="middle" fill="#e2e8f0" font-size="21">Private Git common-dir</text><text x="1000.0" y="402" text-anchor="middle" fill="#e2e8f0" font-size="21">Leases / slots / journal</text><rect x="845" y="490" width="310" height="130" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text x="1000.0" y="525" text-anchor="middle" fill="#a78bfa" font-size="22" font-weight="650">Worktrees + receipts</text><text x="1000.0" y="555" text-anchor="middle" fill="#e2e8f0" font-size="21">Preserve live / recovery data</text><text x="1000.0" y="582" text-anchor="middle" fill="#e2e8f0" font-size="21">Clean owned finished work</text><text x="600" y="735" text-anchor="middle" fill="#e2e8f0" font-size="25">Source organization ≠ state migration ≠ a new task board</text><text x="600" y="780" text-anchor="middle" fill="#94a3b8" font-size="18">PROPOSED • No credentials, installed dependencies or research clones committed here</text></g></svg>